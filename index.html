    <script>
        // ==================== 强制定义：页面切换函数 ====================
        function switchPage(pageId) {
            console.log('[switchPage] 切换到页面:', pageId);
            // 隐藏所有页面
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            // 显示目标页面
            var target = document.getElementById(pageId);
            if (target) {
                target.classList.add('active');
            }
            // 更新底部导航高亮
            var navItems = document.querySelectorAll('#bottomNav .nav-item');
            for (var j = 0; j < navItems.length; j++) {
                navItems[j].classList.remove('active');
                if (navItems[j].getAttribute('data-page') === pageId) {
                    navItems[j].classList.add('active');
                }
            }
            // 关闭抽屉菜单（如果打开）
            if (typeof closeDrawer === 'function') {
                closeDrawer();
            }
        }
        // ==================== 强制定义：关闭抽屉菜单 ====================
        function closeDrawer() {
            var overlay = document.getElementById('drawerOverlay');
            var menu = document.getElementById('drawerMenu');
            if (overlay) {
                overlay.classList.remove('show');
                setTimeout(function() { overlay.style.display = 'none'; }, 300);
            }
            if (menu) {
                menu.classList.remove('show');
                setTimeout(function() { menu.style.display = 'none'; }, 300);
            }
        }
        // ==================== 强制定义：打开抽屉菜单 ====================
        function toggleDrawer(e) {
            if (e) e.stopPropagation();
            var overlay = document.getElementById('drawerOverlay');
            var menu = document.getElementById('drawerMenu');
            if (!overlay || !menu) return;
            overlay.style.display = 'block';
            menu.style.display = 'block';
            setTimeout(function() {
                overlay.classList.add('show');
                menu.classList.add('show');
            }, 10);
        }
    </script>

<!-- 核心函数预定义（确保在app.js加载前可用） -->
<script>
// ==================== 页面切换函数（预定义，避免app.js加载前调用报错） ====================
function switchPage(pageId) {
    // 如果App已加载，使用App的switchPage
    if (typeof App !== 'undefined' && typeof App.switchPage === 'function') {
        App.switchPage(pageId);
        return;
    }
    // 降级方案：直接操作DOM
    var pages = document.querySelectorAll('.page');
    pages.forEach(function(p) { p.classList.remove('active'); });
    var targetPage = document.getElementById(pageId);
    if (targetPage) targetPage.classList.add('active');
    
    // 更新导航高亮
    var navItems = document.querySelectorAll('#bottomNav .nav-item');
    navItems.forEach(function(item) {
        item.classList.remove('active');
        if (item.getAttribute('data-page') === pageId) {
            item.classList.add('active');
        }
    });
}

// ==================== 认证就绪管理器（确保认证完成后再执行敏感操作） ====================
var AuthReadyManager = {
    _callbacks: [],
    _isReady: false,
    _isChecking: false,
    
    // 注册认证就绪回调
    onReady: function(callback) {
        if (this._isReady) {
            // 已就绪，立即执行
            callback();
        } else {
            // 未就绪，加入队列
            this._callbacks.push(callback);
        }
    },
    
    // 标记认证就绪
    setReady: function() {
        this._isReady = true;
        // 执行所有等待的回调
        this._callbacks.forEach(function(cb) {
            try { cb(); } catch(e) { console.error('AuthReady回调执行失败:', e); }
        });
        this._callbacks = [];
    },
    
    // 检查登录状态（由app.js调用）
    checkAuth: function() {
        if (this._isChecking) return;
        this._isChecking = true;
        
        var self = this;
        // 尝试从后端验证登录状态
        fetch('/api/user/info', {
            method: 'GET',
            credentials: 'same-origin'
        }).then(function(res) {
            if (res.status === 200) {
                console.log('[AuthReady] 用户已登录');
            } else {
                console.log('[AuthReady] 用户未登录');
            }
            // 无论登录与否，都标记就绪（未登录时也会回退到本地数据）
            self.setReady();
        }).catch(function(err) {
            console.log('[AuthReady] 认证检查失败:', err);
            self.setReady(); // 网络错误时也继续
        });
    }
};

// 全局快捷函数
function afterAuthReady(callback) {
    AuthReadyManager.onReady(callback);
}
</script>

<!-- 抽屉菜单控制脚本（独立，不修改app.js） -->
<script>
function toggleDrawer(e) {
    if (e) e.stopPropagation();
    var overlay = document.getElementById('drawerOverlay');
    var menu = document.getElementById('drawerMenu');
    overlay.style.display = 'block';
    menu.style.display = 'block';
    requestAnimationFrame(function() {
        overlay.classList.add('show');
        menu.classList.add('show');
    });
}
function closeDrawer() {
    var overlay = document.getElementById('drawerOverlay');
    var menu = document.getElementById('drawerMenu');
    overlay.classList.remove('show');
    menu.classList.remove('show');
    setTimeout(function() {
        overlay.style.display = 'none';
        menu.style.display = 'none';
    }, 300);
}
// 底部导航快速绑定（确保DOM加载后立即生效）
(function() {
    function bindNavItems() {
        var navItems = document.querySelectorAll('.nav-item[data-page]');
        navItems.forEach(function(item) {
            var pageId = item.getAttribute('data-page');
            if (pageId && !item.onclick) {
                item.onclick = function() {
                    if (typeof switchPage === 'function') {
                        switchPage(pageId);
                    }
                };
            }
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindNavItems);
    } else {
        bindNavItems();
    }
})();
</script>

<script>

// ==================== 重型分析器懒加载 ====================
// 这些分析器只在需要时加载，避免阻塞首页交互
var LazyLoader = {
    loaded: {},
    load: function(src) {
        if (this.loaded[src]) return Promise.resolve();
        return new Promise(function(resolve, reject) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = function() {
                LazyLoader.loaded[src] = true;
                resolve();
            };
            script.onerror = reject;
            document.head.appendChild(script);
        });
    },
    // 预加载关键资源（在页面空闲时）
    preload: function(src) {
        if (this.loaded[src]) return;
        if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
                LazyLoader.load(src);
            }, { timeout: 5000 });
        } else {
            setTimeout(function() {
                LazyLoader.load(src);
            }, 2000);
        }
    }
};

// 页面加载完成后，空闲时预加载重型分析器
window.addEventListener('load', function() {
    // 预加载所有分析器（用于姓名拟定、合配、运势等功能）
    LazyLoader.preload('js/relation-analyzer.js');
    LazyLoader.preload('js/mingli-analyzer.js');
    LazyLoader.preload('js/hepei-analyzer.js');
    LazyLoader.preload('js/huangli.js');
});
</script>
