<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人中心</title>
    <style>
    :root {
        --bg-primary: #F5F0E8;
        --bg-secondary: #FFF8EE;
        --bg-card: #FFFCF5;
        --border-color: #D4C5A0;
        --border-dark: #B8A472;
        --text-primary: #3D2B1F;
        --text-secondary: #6B5B4E;
        --text-light: #8C7B6B;
        --red-primary: #A81216;
        --red-dark: #8B1A1A;
        --red-light: #E8D0D0;
        --gold: #C8A84E;
        --gold-light: #E8D48C;
        --green: #4A7C59;
        --shadow: rgba(61, 43, 31, 0.1);
        --shadow-strong: rgba(61, 43, 31, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        font-size: 14px;
        line-height: 1.6;
        padding-bottom: 30px;
    }

    /* ==================== 顶部标题栏 ==================== */
    .header {
        background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
        color: #FFF;
        padding: 15px 20px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 200;
        box-shadow: 0 2px 8px var(--shadow-strong);
    }
    .header h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 3px;
    }
    .header .back-link {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #FFF;
        text-decoration: none;
        font-size: 14px;
        opacity: 0.9;
    }
    .header .back-link:hover { opacity: 1; }

    /* ==================== 页面容器 ==================== */
    .page-container {
        padding: 12px;
        max-width: 480px;
        margin: 0 auto;
    }

    /* ==================== 用户信息卡片 ==================== */
    .user-card {
        background: #FFF;
        border-radius: 12px;
        padding: 20px 16px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        color: #FFF;
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
    }
    .avatar.gray { background: #BFBFBF; }
    .user-info {
        flex: 1;
        min-width: 0;
    }
    .user-info .username {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
    }
    .user-info .days-text {
        font-size: 12px;
        color: var(--text-light);
        margin-bottom: 8px;
    }
    .btn-change-pwd {
        display: inline-block;
        padding: 5px 14px;
        font-size: 12px;
        color: var(--red-primary);
        background: transparent;
        border: 1px solid var(--red-primary);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 1px;
    }
    .btn-change-pwd:active { background: var(--red-light); }

    /* ==================== 通用卡片 ==================== */
    .section-card {
        background: #FFF;
        border-radius: 12px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        overflow: hidden;
    }
    .section-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        padding: 14px 16px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .section-title .icon {
        font-size: 16px;
    }

    /* ==================== 八字档案 ==================== */
    .archive-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        color: var(--text-primary);
    }
    .archive-item:active { background: #FAF6EE; }
    .archive-item .label {
        font-size: 14px;
    }
    .archive-item .count {
        font-size: 13px;
        color: var(--text-light);
    }
    .archive-item .arrow {
        color: #CCC;
        font-size: 14px;
        margin-left: 6px;
    }

    /* ==================== 使用足迹 ==================== */
    .footprint-list {
        padding: 0 16px 14px;
    }
    .footprint-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #F5F0E8;
    }
    .footprint-item:last-child { border-bottom: none; }
    .footprint-item .label {
        font-size: 14px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .footprint-item .label .fp-icon {
        font-size: 16px;
    }
    .footprint-item .count {
        font-size: 13px;
        color: var(--text-light);
    }

    /* ==================== 暖心文案 ==================== */
    .warm-text-card {
        background: #FFF;
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 20px 16px;
        box-shadow: 0 2px 8px var(--shadow);
        text-align: center;
    }
    .warm-text-card .warm-icon {
        font-size: 28px;
        margin-bottom: 8px;
    }
    .warm-text-card .warm-content {
        font-size: 14px;
        color: #888;
        line-height: 1.8;
        font-style: italic;
    }

    /* ==================== 底部微信入口 ==================== */
    .wechat-card {
        background: #FFF;
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px var(--shadow);
        text-align: center;
    }
    .wechat-card .wechat-label {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    .wechat-card .wechat-id {
        font-size: 16px;
        font-weight: 600;
        color: var(--red-primary);
        letter-spacing: 1px;
    }

    /* ==================== 退出登录 ==================== */
    .logout-section {
        text-align: center;
        padding: 20px 0 10px;
    }
    .btn-logout {
        display: inline-block;
        padding: 10px 40px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        color: var(--red-primary);
        background: transparent;
        letter-spacing: 1px;
        transition: all 0.2s;
    }
    .btn-logout:active { background: var(--red-light); }

    /* ==================== 底部合规声明 ==================== */
    .disclaimer {
        text-align: center;
        padding: 16px 20px 20px;
        font-size: 11px;
        color: var(--text-light);
        line-height: 1.8;
    }

    /* ==================== 登录/注册按钮组 ==================== */
    .auth-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 12px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
        background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
        color: #FFF;
        box-shadow: 0 2px 6px rgba(168, 18, 22, 0.3);
    }
    .btn-outline {
        background: transparent;
        color: var(--red-primary);
        border: 1px solid var(--red-primary);
    }
    .btn-outline:active { background: var(--red-light); }
    .auth-actions .btn {
        flex: 1;
        padding: 8px 0;
        font-size: 13px;
        letter-spacing: 1px;
        height: auto;
        line-height: 1.4;
        text-align: center;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ==================== 修改密码弹窗 ==================== */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
        background: #FFF;
        border-radius: 12px;
        padding: 24px 20px 20px;
        width: 320px;
        max-width: 90vw;
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .modal-title {
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 18px;
        color: var(--text-primary);
    }
    .modal-box .form-group {
        margin-bottom: 14px;
    }
    .modal-box .form-group label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
    }
    .modal-box .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 14px;
    }
    .modal-box .form-group input:focus {
        outline: none;
        border-color: var(--red-primary);
        box-shadow: 0 0 0 2px rgba(168, 18, 22, 0.1);
    }
    .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
    }
    .modal-actions .btn {
        flex: 1;
        padding: 10px 0;
        font-size: 14px;
        letter-spacing: 1px;
        height: auto;
        line-height: 1.4;
    }

    /* ==================== 动画 ==================== */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }

    /* ==================== 响应式 ==================== */
    @media (max-width: 375px) {
        .page-container { padding: 8px; }
        .user-card { padding: 16px 12px; gap: 10px; }
        .avatar { width: 48px; height: 48px; font-size: 18px; }
        .section-title { padding: 12px 12px 6px; }
        .footprint-list { padding: 0 12px 12px; }
        .archive-item { padding: 10px 12px; }
    }
    </style>
</head>
<body>

<!-- 顶部标题栏 -->
<header class="header">
    <a class="back-link" href="../index.html">&lt; 返回</a>
    <h1>个人中心</h1>
</header>

<div class="page-container">

    <!-- 第一区：用户信息卡片 -->
    <div class="user-card fade-in" id="userCard">
        <!-- 由 JS 动态渲染 -->
    </div>

    <!-- 第二区：八字档案 -->
    <div class="section-card fade-in" id="archiveCard">
        <div class="section-title">
            <span class="icon">&#x1F4CB;</span>
            <span>八字档案</span>
        </div>
        <a class="archive-item" href="my.html" id="archiveLink">
            <span class="label" id="archiveText">已保存 0 条排盘记录</span>
            <span>
                <span class="count" id="archiveCount">查看</span>
                <span class="arrow">&gt;</span>
            </span>
        </a>
    </div>

    <!-- 第三区：使用足迹 -->
    <div class="section-card fade-in" id="footprintCard">
        <div class="section-title">
            <span class="icon">&#x1F3C3;</span>
            <span>使用足迹</span>
        </div>
        <div class="footprint-list">
            <div class="footprint-item">
                <span class="label"><span class="fp-icon">&#x270D;&#xFE0F;</span> 姓名评测</span>
                <span class="count" id="evalCount">0 次</span>
            </div>
            <div class="footprint-item">
                <span class="label"><span class="fp-icon">&#x1F476;</span> 宝宝取名</span>
                <span class="count" id="nameCount">0 次</span>
            </div>
            <div class="footprint-item">
                <span class="label"><span class="fp-icon">&#x1F48D;</span> 合配分析</span>
                <span class="count" id="hepeiCount">0 次</span>
            </div>
            <div class="footprint-item">
                <span class="label"><span class="fp-icon">&#x1F52E;</span> 六爻排盘</span>
                <span class="count" id="liuyaoCount">0 次</span>
            </div>
        </div>
    </div>

    <!-- 第四区：暖心引导文案 -->
    <div class="warm-text-card fade-in" id="warmCard">
        <div class="warm-icon">&#x2728;</div>
        <div class="warm-content" id="warmText">
            <!-- 由 JS 动态渲染 -->
        </div>
    </div>

    <!-- 底部：微信联系入口 -->
    <div class="wechat-card fade-in">
        <div class="wechat-label">如需了解更多，欢迎添加站长微信</div>
        <div class="wechat-id">DLing3313</div>
    </div>

    <!-- 退出登录 -->
    <div class="logout-section" id="logoutSection" style="display:none;">
        <button class="btn-logout" id="btnLogout">退出登录</button>
    </div>

    <!-- 底部合规声明 -->
    <div class="disclaimer">
        本内容仅供传统民俗文化参考，基于《三命通会》《渊海子平》等传统命理典籍整理，不构成命运判定、不做吉凶预测、不作为任何人生决策依据。
    </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="pwdModal">
    <div class="modal-box">
        <div class="modal-title">修改密码</div>
        <div class="form-group">
            <label>旧密码</label>
            <input type="password" id="pwdOld" placeholder="请输入旧密码" autocomplete="off">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" id="pwdNew" placeholder="请输入新密码（至少6位）" autocomplete="off">
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="pwdConfirm" placeholder="请再次输入新密码" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="pwdCancel">取消</button>
            <button class="btn btn-primary" id="pwdSubmit">确认修改</button>
        </div>
    </div>
</div>

<!-- 登录/注册弹窗 -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-box">
        <div class="modal-title" id="loginModalTitle">登录</div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="loginModalUsername" placeholder="请输入用户名" maxlength="20" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginModalPassword" placeholder="请输入密码" maxlength="30" autocomplete="off">
        </div>
        <div class="form-group" id="loginCaptchaGroup" style="display:none;">
            <label>验证码</label>
            <div style="display:flex;align-items:center;gap:10px;">
                <input type="text" id="loginCaptchaInput" placeholder="请输入验证码" maxlength="4" style="flex:1;" autocomplete="off">
                <img id="loginCaptchaImg" src="/api/captcha?t=1" alt="验证码" title="点击刷新验证码" style="cursor:pointer;height:40px;border-radius:4px;border:1px solid var(--border-color);flex-shrink:0;">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="loginModalCancel">取消</button>
            <button class="btn btn-primary" id="loginModalSubmit">登录</button>
        </div>
        <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary);">
            <span id="loginSwitchHint">没有账号？</span><a href="javascript:void(0)" id="loginSwitchLink" style="color:var(--red-primary);text-decoration:none;">去注册</a>
        </div>
    </div>
</div>

<script src="../js/storage.js"></script>
<script>
(function () {
    'use strict';

    // ==================== 数据读取 ====================

    var user = Storage.getCurrentUser();
    var currentUsername = user ? user.username : '';
    var baziRecords = []; // 异步加载

    // 读取姓名记录
    var nameRecords = JSON.parse(localStorage.getItem('bazi_name_records') || '[]');
    var myNameRecords = nameRecords.filter(function (r) {
        return r.username === currentUsername;
    });
    var evalRecords = myNameRecords.filter(function (r) { return r.type === 'evaluate'; });
    var nameGenRecords = myNameRecords.filter(function (r) { return r.type === 'name'; });

    // ==================== 暖心文案（根据时间段） ====================

    function getWarmText() {
        var hour = new Date().getHours();
        if (hour >= 5 && hour < 8) {
            return '一日之计在于晨，愿你今天元气满满。';
        } else if (hour >= 8 && hour < 12) {
            return '上午好，命理探索正当时。';
        } else if (hour >= 12 && hour < 14) {
            return '午安，稍作休息，蓄力前行。';
        } else if (hour >= 14 && hour < 18) {
            return '下午好，静能生慧，慧能生明。';
        } else if (hour >= 18 && hour < 22) {
            return '晚间好，一天的奔波辛苦了。';
        } else {
            return '夜深了，身体健康是第一福田，早些休息。';
        }
    }

    // ==================== 渲染用户信息卡片 ====================

    function renderUserCard() {
        var card = document.getElementById('userCard');
        if (!user) {
            card.innerHTML =
                '<div class="avatar gray">未</div>' +
                '<div class="user-info">' +
                    '<div class="username">未登录</div>' +
                    '<div class="days-text">登录后查看更多功能</div>' +
                    '<div class="auth-actions">' +
                        '<button class="btn btn-primary" id="btnMyLogin">登录</button>' +
                        '<button class="btn btn-outline" id="btnMyRegister">注册</button>' +
                    '</div>' +
                '</div>';
            document.getElementById('logoutSection').style.display = 'none';
            document.getElementById('btnMyLogin').addEventListener('click', function () {
                openLoginModal('login');
            });
            document.getElementById('btnMyRegister').addEventListener('click', function () {
                openLoginModal('register');
            });
        } else {
            // 取用户名前两个字符作为头像文字
            var avatarText = user.username.length >= 2
                ? user.username.substring(0, 2)
                : user.username.charAt(0);

            // 计算注册天数
            var days = 0;
            if (user.createTime) {
                var regDate = new Date(user.createTime);
                var now = new Date();
                days = Math.floor((now - regDate) / (1000 * 60 * 60 * 24));
                if (days < 0) days = 0;
            }

            card.innerHTML =
                '<div class="avatar">' + escapeHtml(avatarText) + '</div>' +
                '<div class="user-info">' +
                    '<div class="username">' + escapeHtml(user.username) + '</div>' +
                    '<div class="days-text">已陪伴你 ' + days + ' 天</div>' +
                    '<button class="btn-change-pwd" id="btnChangePwd">修改密码</button>' +
                '</div>';
            document.getElementById('logoutSection').style.display = 'block';
            document.getElementById('btnChangePwd').addEventListener('click', function () {
                openPwdModal();
            });
        }
    }

    // ==================== 渲染统计数据 ====================

    function renderStats() {
        // 八字档案
        document.getElementById('archiveText').textContent = '已保存 ' + baziRecords.length + ' 条排盘记录';

        // 使用足迹
        document.getElementById('evalCount').textContent = evalRecords.length + ' 次';
        document.getElementById('nameCount').textContent = nameGenRecords.length + ' 次';

        // 合配记录计数
        var hepeiCountEl = document.getElementById('hepeiCount');
        if (user) {
            var hepeiKey = 'bazi_hepei_records_' + user.username;
            var hepeiRecords = JSON.parse(localStorage.getItem(hepeiKey) || '[]');
            hepeiCountEl.textContent = hepeiRecords.length + ' 次';
        }

        // 六爻记录计数（异步从后端加载）
        var liuyaoCountEl = document.getElementById('liuyaoCount');
        if (user) {
            fetch('/api/liuyao/list?pageSize=1', {
                credentials: 'same-origin'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.code === 200 && data.data) {
                    liuyaoCountEl.textContent = data.data.total + ' 次';
                }
            })
            .catch(function() {});
        }
    }

    // ==================== 渲染暖心文案 ====================

    function renderWarmText() {
        document.getElementById('warmText').textContent = getWarmText();
    }

    // ==================== 退出登录 ====================

    document.getElementById('btnLogout').addEventListener('click', function () {
        if (confirm('确定退出登录？')) {
            Storage.logout();
            window.location.reload();
        }
    });

    // ==================== 修改密码弹窗 ====================

    var pwdModal = document.getElementById('pwdModal');

    function openPwdModal() {
        document.getElementById('pwdOld').value = '';
        document.getElementById('pwdNew').value = '';
        document.getElementById('pwdConfirm').value = '';
        pwdModal.classList.add('show');
    }

    function closePwdModal() {
        pwdModal.classList.remove('show');
    }

    document.getElementById('pwdCancel').addEventListener('click', closePwdModal);

    pwdModal.addEventListener('click', function (e) {
        if (e.target === pwdModal) closePwdModal();
    });

    document.getElementById('pwdSubmit').addEventListener('click', function () {
        var oldPwd = document.getElementById('pwdOld').value;
        var newPwd = document.getElementById('pwdNew').value;
        var confirmPwd = document.getElementById('pwdConfirm').value;

        if (!user) { alert('请先登录'); return; }
        if (!oldPwd) { alert('请输入旧密码'); return; }
        if (!newPwd) { alert('请输入新密码'); return; }
        if (newPwd.length < 6) { alert('新密码至少6位'); return; }
        if (newPwd !== confirmPwd) { alert('两次新密码不一致'); return; }

        var result = Storage.changePassword(user.username, oldPwd, newPwd);
        if (result.success) {
            alert('密码修改成功');
            closePwdModal();
        } else {
            alert(result.message);
        }
    });

    // ==================== 工具函数 ====================

    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    // ==================== 登录/注册弹窗逻辑 ====================

    var loginMode = 'login';

    function openLoginModal(mode) {
        loginMode = mode || 'login';
        var modal = document.getElementById('loginModal');
        var title = document.getElementById('loginModalTitle');
        var submitBtn = document.getElementById('loginModalSubmit');
        var switchHint = document.getElementById('loginSwitchHint');
        var switchLink = document.getElementById('loginSwitchLink');
        var captchaGroup = document.getElementById('loginCaptchaGroup');
        var captchaInput = document.getElementById('loginCaptchaInput');
        var captchaImg = document.getElementById('loginCaptchaImg');

        document.getElementById('loginModalUsername').value = '';
        document.getElementById('loginModalPassword').value = '';
        if (captchaInput) captchaInput.value = '';

        if (loginMode === 'register') {
            title.textContent = '注册';
            submitBtn.textContent = '注册';
            switchHint.textContent = '已有账号？';
            switchLink.textContent = '去登录';
            if (captchaGroup) captchaGroup.style.display = '';
            if (captchaImg) captchaImg.src = '/api/captcha?t=' + Date.now();
        } else {
            title.textContent = '登录';
            submitBtn.textContent = '登录';
            switchHint.textContent = '没有账号？';
            switchLink.textContent = '去注册';
            if (captchaGroup) captchaGroup.style.display = 'none';
        }
        modal.classList.add('show');
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.remove('show');
    }

    document.getElementById('loginModalCancel').addEventListener('click', closeLoginModal);
    document.getElementById('loginModal').addEventListener('click', function (e) {
        if (e.target === document.getElementById('loginModal')) closeLoginModal();
    });

    // 验证码图片点击刷新
    var loginCaptchaImg = document.getElementById('loginCaptchaImg');
    if (loginCaptchaImg) {
        loginCaptchaImg.addEventListener('click', function () {
            this.src = '/api/captcha?t=' + Date.now();
        });
    }

    // 切换登录/注册
    document.getElementById('loginSwitchLink').addEventListener('click', function () {
        openLoginModal(loginMode === 'login' ? 'register' : 'login');
    });

    // 提交登录/注册
    document.getElementById('loginModalSubmit').addEventListener('click', function () {
        var username = document.getElementById('loginModalUsername').value.trim();
        var password = document.getElementById('loginModalPassword').value;

        if (!username) { alert('请输入用户名'); return; }
        if (!password) { alert('请输入密码'); return; }
        if (password.length < 6) { alert('密码至少6位'); return; }

        if (loginMode === 'register') {
            var captchaInput = document.getElementById('loginCaptchaInput');
            var captchaValue = captchaInput ? captchaInput.value.trim() : '';
            if (!captchaValue) { alert('请输入验证码'); return; }

            fetch('/api/user/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username: username, password: password, captcha: captchaValue })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.code === 200 || data.success) {
                    fetch('/api/user/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ username: username, password: password })
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (loginData) {
                        if (loginData.code === 200 && loginData.data) {
                            // token 已通过 HttpOnly Cookie 设置，前端不存储
                            localStorage.setItem('v2_user', JSON.stringify({
                                username: loginData.data.username || username,
                                role: loginData.data.role || ''
                            }));
                            localStorage.setItem('bazi_current_user', JSON.stringify({
                                username: loginData.data.username || username,
                                createTime: Date.now()
                            }));
                            alert('注册成功，已自动登录');
                            closeLoginModal();
                            window.location.reload();
                        } else {
                            alert('注册成功，请手动登录');
                            openLoginModal('login');
                        }
                    })
                    .catch(function () {
                        alert('注册成功，请手动登录');
                        openLoginModal('login');
                    });
                } else {
                    alert(data.message || '注册失败');
                    var img = document.getElementById('loginCaptchaImg');
                    if (img) img.src = '/api/captcha?t=' + Date.now();
                    if (captchaInput) captchaInput.value = '';
                }
            })
            .catch(function () {
                alert('注册失败，请检查网络');
            });
        } else {
            fetch('/api/user/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.code === 200 && data.data) {
                    // token 已通过 HttpOnly Cookie 设置，前端不存储
                    localStorage.setItem('v2_user', JSON.stringify({
                        username: data.data.username || username,
                        role: data.data.role || ''
                    }));
                    localStorage.setItem('bazi_current_user', JSON.stringify({
                        username: data.data.username || username,
                        createTime: Date.now()
                    }));
                    alert('登录成功');
                    closeLoginModal();
                    window.location.reload();
                } else {
                    alert(data.message || '登录失败');
                }
            })
            .catch(function () {
                alert('登录失败，请检查网络');
            });
        }
    });

    // ==================== 初始化 ====================

    renderUserCard();
    renderWarmText();
    renderStats();

    // 异步加载排盘记录
    (async function() {
        if (Storage.isLoggedIn()) {
            baziRecords = await Storage.getRecords();
            document.getElementById('archiveText').textContent = '已保存 ' + baziRecords.length + ' 条排盘记录';
        }
    })();

})();
</script>

</body>
</html>
