<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>传统民俗姓名拟定</title>
    <style>
    /* ==================== CSS 变量与全局样式 ==================== */
    :root {
        --bg-primary: #F5F0E8;
        --bg-secondary: #FFF8EE;
        --bg-card: #FFFCF5;
        --border-color: #D4C5A0;
        --border-dark: #B8A472;
        --text-primary: #3D2B1F;
        --text-secondary: #6B5B4E;
        --text-light: #8C7B6B;
        --red-primary: #A81216;
        --red-dark: #8B1A1A;
        --red-light: #E8D0D0;
        --gold: #C8A84E;
        --gold-light: #E8D48C;
        --green: #4A7C59;
        --blue: #4A6B8A;
        --shadow: rgba(61, 43, 31, 0.1);
        --shadow-strong: rgba(61, 43, 31, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        font-size: 14px;
        line-height: 1.6;
        padding-bottom: 20px;
    }

    /* ==================== 顶部标题栏 ==================== */
    .header {
        background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
        color: #FFF;
        padding: 15px 20px;
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 200;
        box-shadow: 0 2px 8px var(--shadow-strong);
    }
    .header h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 3px;
    }
    .header .back-link {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #FFF;
        text-decoration: none;
        font-size: 14px;
        opacity: 0.9;
    }
    .header .back-link:hover { opacity: 1; }

    /* ==================== 页面容器 ==================== */
    .page-container {
        padding: 12px;
        max-width: 480px;
        margin: 0 auto;
    }

    /* ==================== Tab 切换栏 ==================== */
    .tab-bar {
        display: flex;
        background: #FFF;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 12px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 4px var(--shadow);
    }
    .tab-item {
        flex: 1;
        text-align: center;
        padding: 12px 8px;
        font-size: 14px;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.3s;
        border-bottom: 3px solid transparent;
        font-weight: 500;
        user-select: none;
    }
    .tab-item.active {
        color: var(--red-primary);
        border-bottom-color: var(--red-primary);
        font-weight: 600;
    }

    /* ==================== 表单样式 ==================== */
    .form-section {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px 15px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px var(--shadow);
    }
    .form-group {
        margin-bottom: 14px;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
    }
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 14px;
        appearance: auto;
        -webkit-appearance: auto;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: var(--red-primary);
        box-shadow: 0 0 0 2px rgba(168, 18, 22, 0.1);
    }
    .form-group input::placeholder {
        color: var(--text-light);
    }
    .form-row {
        display: flex;
        gap: 10px;
    }
    .form-row .form-group {
        flex: 1;
        margin-bottom: 14px;
    }

    /* 性别选择 */
    .gender-switch {
        display: flex;
        gap: 10px;
    }
    .gender-item {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        color: var(--text-secondary);
        background: var(--bg-secondary);
        transition: all 0.2s;
        user-select: none;
    }
    .gender-item.active {
        background: var(--red-primary);
        color: #FFF;
        border-color: var(--red-primary);
    }

    /* 公历/农历切换（胶囊样式，与主站一致） */
    .calendar-switch {
        display: flex;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 15px;
    }
    .calendar-switch .switch-item {
        flex: 1;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
        border: none;
        background: transparent;
        color: var(--text-secondary);
    }
    .calendar-switch .switch-item.active {
        background: var(--red-primary);
        color: #FFF;
        font-weight: 600;
    }

    /* 按钮 */
    .btn {
        display: block;
        width: 100%;
        padding: 12px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 2px;
        transition: all 0.2s;
    }
    .btn:active {
        transform: scale(0.98);
    }
    .btn-primary {
        background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
        color: #FFF;
        box-shadow: 0 2px 6px rgba(168, 18, 22, 0.3);
        height: 44px;
        line-height: 20px;
    }
    .btn-primary:hover {
        box-shadow: 0 4px 12px rgba(168, 18, 22, 0.4);
    }
    .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* ==================== 结果卡片 ==================== */
    .result-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px 15px;
        margin-top: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        animation: fadeIn 0.3s ease-out;
    }
    .result-title {
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: var(--red-primary);
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
        letter-spacing: 2px;
    }
    .result-subtitle {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 12px 0 8px;
        padding-left: 8px;
        border-left: 3px solid var(--red-primary);
    }
    .result-desc {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.8;
        padding: 4px 0;
    }

    /* 四柱表格 */
    .bazi-table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
        text-align: center;
    }
    .bazi-table th {
        background: var(--red-primary);
        color: #FFF;
        padding: 8px 4px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1px;
    }
    .bazi-table th:first-child { border-radius: 6px 0 0 0; }
    .bazi-table th:last-child { border-radius: 0 6px 0 0; }
    .bazi-table td {
        padding: 6px 4px;
        border: none;
        font-size: 13px;
        background: var(--bg-card);
        vertical-align: middle;
    }
    .bazi-table .gan-cell {
        font-size: 20px;
        font-weight: 700;
        padding: 8px 4px;
    }
    .bazi-table .zhi-cell {
        font-size: 20px;
        font-weight: 700;
        padding: 8px 4px;
    }
    .bazi-table .shishen-cell {
        font-size: 11px;
        color: var(--red-primary);
        font-weight: 500;
    }
    .label-cell {
        font-size: 11px;
        color: var(--text-light);
        white-space: nowrap;
        padding: 4px 6px;
        text-align: center;
        font-weight: 500;
        width: 48px;
    }
    .bazi-bg-light td { background: #FAF6F0; }
    .bazi-bg-dark td { background: #EDE8E0; }

    /* 五行统计 */
    .wuxing-bar {
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
        margin-top: 10px;
        border-top: 1px solid var(--border-color);
    }
    .wuxing-item { text-align: center; }
    .wuxing-item .wx-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .wuxing-item .wx-count { font-size: 11px; color: var(--text-light); }
    .wx-jin { color: #DAA520; }
    .wx-mu { color: #2E8B57; }
    .wx-shui { color: #4169E1; }
    .wx-huo { color: #DC143C; }
    .wx-tu { color: #8B4513; }
    .wx-bar-chart {
        width: 100%;
        height: 6px;
        background: #f0ebe3;
        border-radius: 3px;
        margin: 4px 0;
        overflow: hidden;
    }
    .wx-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease;
        min-width: 0;
    }
    .wx-status { font-size: 10px; margin-left: 2px; font-weight: 600; }
    .wx-status-missing { color: #999; }
    .wx-status-strong { color: #DC143C; }

    /* ==================== 大模型结果区域 ==================== */
    .ai-result-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px 15px;
        margin-top: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        animation: fadeIn 0.4s ease-out;
    }
    .ai-result-card .result-title {
        margin-bottom: 14px;
    }
    .cache-hit-tag {
        display: inline-block;
        background: linear-gradient(135deg, #E8F4FD, #D6ECFA);
        color: #1E90FF;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 12px;
        font-weight: 500;
    }
    .ai-content {
        font-size: 14px;
        line-height: 1.9;
        color: var(--text-primary);
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .ai-content .name-scheme {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 8px 0;
        transition: background 0.2s;
    }
    .ai-content .name-scheme:hover {
        background: #FFF5E6;
    }
    .ai-content .name-scheme-name {
        font-size: 18px;
        font-weight: 700;
        color: var(--red-primary);
        margin-bottom: 4px;
    }
    .ai-content .name-scheme-wx {
        font-size: 13px;
        color: var(--gold);
        font-weight: 500;
    }
    .ai-content .name-scheme-meaning {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 4px;
    }
    .ai-content .section-header {
        font-size: 15px;
        font-weight: 700;
        color: var(--red-primary);
        margin: 14px 0 8px;
        padding-bottom: 4px;
        border-bottom: 1px dashed var(--border-color);
    }
    .ai-content .section-header:first-child {
        margin-top: 0;
    }
    .ai-content .score-line {
        font-size: 14px;
        color: var(--red-primary);
        font-weight: 600;
        margin: 4px 0;
    }

    /* 加载动画 */
    .loading-box {
        text-align: center;
        padding: 30px 20px;
    }
    .loading-spinner {
        display: inline-block;
        width: 36px;
        height: 36px;
        border: 3px solid var(--border-color);
        border-top-color: var(--red-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
    }
    .loading-text {
        font-size: 14px;
        color: var(--text-secondary);
        letter-spacing: 1px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }



    /* ==================== 底部合规声明 ==================== */
    .disclaimer-bar {
        text-align: center;
        padding: 16px 20px;
        margin-top: 24px;
        font-size: 12px;
        color: var(--text-light);
        line-height: 1.8;
        border-top: 1px solid var(--border-color);
    }

    /* ==================== Toast 提示 ==================== */
    .toast {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: rgba(61, 43, 31, 0.9);
        color: #FFF;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 14px;
        z-index: 9999;
        opacity: 0;
        transition: all 0.3s;
        pointer-events: none;
        white-space: nowrap;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* ==================== 滚动条美化 ==================== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

    /* ==================== 响应式 ==================== */
    @media (min-width: 481px) {
        .page-container { padding: 20px; }
        .header h1 { font-size: 20px; }
        .bazi-table .gan-cell,
        .bazi-table .zhi-cell { font-size: 24px; }
    }
    @media (max-width: 420px) {
        .page-container { padding: 10px; }
        .result-card, .ai-result-card { padding: 12px 10px; border-radius: 8px; }
        .result-title { font-size: 15px; margin-bottom: 10px; padding-bottom: 8px; }
        .bazi-table .gan-cell,
        .bazi-table .zhi-cell { font-size: 18px; padding: 6px 2px; }
        .bazi-table th { font-size: 11px; padding: 6px 2px; }
        .bazi-table td { padding: 4px 2px; font-size: 12px; }
        .header h1 { font-size: 16px; }
        .form-row { flex-direction: column; gap: 0; }
        .wuxing-bar { gap: 4px; }
        .wuxing-item .wx-name { font-size: 13px; }
        .tab-item { font-size: 13px; padding: 10px 4px; }
    }
    </style>
</head>
<body>

<!-- 顶部标题栏 -->
<header class="header">
    <a class="back-link" href="../index.html">&larr; 主页</a>
    <h1>传统民俗姓名拟定</h1>
</header>

<!-- 页面容器 -->
<div class="page-container" id="appContainer">

    <!-- Tab 切换栏 -->
    <div class="tab-bar" id="tabBar">
        <div class="tab-item active" data-tab="evaluate">姓名民俗评测</div>
        <div class="tab-item" data-tab="name">宝宝民俗取名</div>
    </div>

    <!-- Tab1：姓名民俗评测表单 -->
    <div id="tabEvaluate" class="tab-content">
        <div class="form-section">
            <!-- 排盘记录下拉 -->
            <div class="form-group">
                <label>选择我的排盘记录</label>
                <select id="evalRecordSelect" style="width:100%;padding:9px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:14px;background:var(--bg-secondary);color:var(--text-primary);outline:none;">
                    <option value="">-- 手动输入或选择记录 --</option>
                </select>
            </div>

            <!-- 姓名 -->
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="evalName" placeholder="请输入姓名" maxlength="20">
            </div>

            <!-- 性别 -->
            <div class="form-group">
                <label>性别</label>
                <div class="gender-switch" id="evalGenderSwitch">
                    <div class="gender-item active" data-gender="1">男</div>
                    <div class="gender-item" data-gender="0">女</div>
                </div>
            </div>

            <!-- 公历/农历切换 -->
            <div class="calendar-switch" id="evalCalendarSwitch">
                <button class="switch-item active" data-type="solar">公历</button>
                <button class="switch-item" data-type="lunar">农历</button>
            </div>

            <!-- 出生日期 -->
            <div class="form-row">
                <div class="form-group">
                    <label>年</label>
                    <select id="evalYear"></select>
                </div>
                <div class="form-group">
                    <label>月</label>
                    <select id="evalMonth"></select>
                </div>
                <div class="form-group">
                    <label>日</label>
                    <select id="evalDay"></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>时</label>
                    <select id="evalHour"></select>
                </div>
                <div class="form-group">
                    <label>分</label>
                    <select id="evalMinute"></select>
                </div>
            </div>

            <!-- 出生地 -->
            <div class="form-group">
                <label>出生地</label>
                <div class="form-row">
                    <div class="form-group">
                        <select id="evalProvince">
                            <option value="">请选择省份</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="evalCity">
                            <option value="">请选择城市</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 开始评测按钮 -->
            <button class="btn btn-primary" id="btnEvaluate">开始评测</button>
        </div>
    </div>

    <!-- Tab2：宝宝民俗取名表单 -->
    <div id="tabName" class="tab-content" style="display:none;">
        <div class="form-section">
            <!-- 宝宝姓氏 -->
            <div class="form-group">
                <label>宝宝姓氏</label>
                <input type="text" id="nameSurname" placeholder="请输入姓氏" maxlength="10">
            </div>

            <!-- 性别 -->
            <div class="form-group">
                <label>性别</label>
                <div class="gender-switch" id="nameGenderSwitch">
                    <div class="gender-item active" data-gender="1">男</div>
                    <div class="gender-item" data-gender="0">女</div>
                </div>
            </div>

            <!-- 公历/农历切换 -->
            <div class="calendar-switch" id="nameCalendarSwitch">
                <button class="switch-item active" data-type="solar">公历</button>
                <button class="switch-item" data-type="lunar">农历</button>
            </div>

            <!-- 出生日期 -->
            <div class="form-row">
                <div class="form-group">
                    <label>年</label>
                    <select id="nameYear"></select>
                </div>
                <div class="form-group">
                    <label>月</label>
                    <select id="nameMonth"></select>
                </div>
                <div class="form-group">
                    <label>日</label>
                    <select id="nameDay"></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>时</label>
                    <select id="nameHour"></select>
                </div>
                <div class="form-group">
                    <label>分</label>
                    <select id="nameMinute"></select>
                </div>
            </div>

            <!-- 出生地 -->
            <div class="form-group">
                <label>出生地</label>
                <div class="form-row">
                    <div class="form-group">
                        <select id="nameProvince">
                            <option value="">请选择省份</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="nameCity">
                            <option value="">请选择城市</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 期望风格 -->
            <div class="form-group">
                <label>期望风格</label>
                <select id="nameStyle">
                    <option value="文雅">文雅</option>
                    <option value="诗意">诗意</option>
                    <option value="简约">简约</option>
                    <option value="大气">大气</option>
                    <option value="阳光">阳光</option>
                    <option value="温婉">温婉</option>
                </select>
            </div>

            <!-- 开始取名按钮 -->
            <button class="btn btn-primary" id="btnName">开始取名</button>
        </div>
    </div>

    <!-- 结果展示区（两个Tab共用） -->
    <div id="resultArea" style="display:none;"></div>

    <!-- 底部合规声明 -->
    <div class="disclaimer-bar">
        本内容仅供传统民俗文化参考，基于《三命通会》《渊海子平》等传统命理典籍整理，不构成命运判定、不做吉凶预测、不作为任何人生决策依据。
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>



<!-- 引入主站 JS 模块（只读复用） -->
<script src="../js/solar_terms.js"></script>
<script src="../js/lunar.js"></script>
<script src="../js/solar-time.js"></script>
<script src="../js/city-data.js"></script>
<script src="../js/bazi.js"></script>
<script src="../js/storage.js"></script>
<script src="../config.js"></script>
<script src="../js/relation-analyzer.js"></script>
<script src="../js/mingli-analyzer.js"></script>

<script>
(function() {
    'use strict';

    // ==================== 状态变量 ====================
    var currentTab = 'evaluate';
    var evalCalendarType = 'solar';
    var nameCalendarType = 'solar';
    var evalGender = 1;
    var nameGender = 1;

    // ==================== 工具函数 ====================
    function padZero(n) { return n < 10 ? '0' + n : '' + n; }

    function $(id) { return document.getElementById(id); }

    function showToast(msg) {
        var t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    function getGanColor(ganIdx) {
        var wx = Lunar.wuXingGan[ganIdx];

    /**
     * 初始化公历日期选择器
     * @param {string} prefix - 表单元素ID前缀，如 'eval' 或 'name'
     */
    function initSolarDateSelectors(prefix) {
        var now = new Date();
        var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();

        // 年份：1900-2100，默认当前年
        var yearSel = $(prefix + 'Year');
        yearSel.innerHTML = '';
        for (var sy = 1900; sy <= 2100; sy++) {
            var opt = document.createElement('option');
            opt.value = sy;
            opt.textContent = sy + '年';
            if (sy === y) opt.selected = true;
            yearSel.appendChild(opt);
        }

        // 月份：1-12，默认当前月
        var monthSel = $(prefix + 'Month');
        monthSel.innerHTML = '';
        for (var sm = 1; sm <= 12; sm++) {
            var opt2 = document.createElement('option');
            opt2.value = sm;
            opt2.textContent = padZero(sm) + '月';
            if (sm === m) opt2.selected = true;
            monthSel.appendChild(opt2);
        }

        // 日期：根据年月计算天数，默认1日
        fillSolarDays(prefix, y, m, d);

        // 时：吉时 + 0-23时
        var hourSel = $(prefix + 'Hour');
        hourSel.innerHTML = '';
        var optJiShi = document.createElement('option');
        optJiShi.value = '-1';
        optJiShi.textContent = '吉时';
        hourSel.appendChild(optJiShi);
        for (var sh = 0; sh <= 23; sh++) {
            var opt3 = document.createElement('option');
            opt3.value = sh;
            opt3.textContent = padZero(sh) + '时';
            hourSel.appendChild(opt3);
        }

        // 分：吉分 + 00-59分
        var minuteSel = $(prefix + 'Minute');
        minuteSel.innerHTML = '';
        var optJiFen = document.createElement('option');
        optJiFen.value = '-1';
        optJiFen.textContent = '吉分';
        minuteSel.appendChild(optJiFen);
        for (var mi = 0; mi < 60; mi++) {
            var opt4 = document.createElement('option');
            opt4.value = mi;
            opt4.textContent = padZero(mi) + '分';
            minuteSel.appendChild(opt4);
        }
    }

    /**
     * 填充公历日期天数
     */
    function fillSolarDays(prefix, year, month, defaultDay) {
        var daySel = $(prefix + 'Day');
        var daysPerMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        var daysInMonth = daysPerMonth[month - 1];
        // 闰年判断：能被4整除且不能被100整除，或能被400整除
        if (month === 2 && ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0))) {
            daysInMonth = 29;
        }
        var currentDay = defaultDay || 1;
        if (currentDay > daysInMonth) currentDay = daysInMonth;
        daySel.innerHTML = '';
        for (var sd = 1; sd <= daysInMonth; sd++) {
            var opt = document.createElement('option');
            opt.value = sd;
            opt.textContent = padZero(sd) + '日';
            if (sd === currentDay) opt.selected = true;
            daySel.appendChild(opt);
        }
    }

        // 月份：正月~十二月
        var monthSel = $(prefix + 'Month');
        monthSel.innerHTML = '';
        var lunarMonthNames = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
        for (var m = 1; m <= 12; m++) {
            var opt2 = document.createElement('option');
            opt2.value = m;
            opt2.textContent = lunarMonthNames[m - 1];
            monthSel.appendChild(opt2);

        // 根据年份检查闰月

        // 时：吉时 + 0-23时
        var hourSel = $(prefix + 'Hour');

        optJiShi.value = '-1';

        for (var h = 0; h <= 23; h++) {
            var opt3 = document.createElement('option');
            opt3.value = h;
            opt3.textContent = h + '->' + shiChenNames[h];
            hourSel.appendChild(opt3);
        }

        // 分：吉分 + 00-59分
        var minuteSel = $(prefix + 'Minute');
        minuteSel.innerHTML = '';
        var optJiFen = document.createElement('option');
        optJiFen.value = '-1';
        optJiFen.textContent = '吉分';
        minuteSel.appendChild(optJiFen);
        for (var mi = 0; mi < 60; mi++) {
            var opt4 = document.createElement('option');
            opt4.value = mi;
            opt4.textContent = padZero(mi) + '分';

    /**
     * 更新农历月份下拉列表（含闰月选项）
     */
    function updateLunarMonthOptions(prefix) {
        var yearSel = $(prefix + 'Year');
        var monthSel = $(prefix + 'Month');
        if (!yearSel || !monthSel) return;

        var year = parseInt(yearSel.value) || 2026;
        var leapMonth = 0;
        try {
            leapMonth = Lunar.leapMonth(year);
        } catch(e) {
            leapMonth = 0;
        }

        var monthNames = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
        var currentMonth = parseInt(monthSel.value) || 1;

        var html = '';
        for (var m = 1; m <= 12; m++) {
            html += '<option value="' + m + '">' + monthNames[m-1] + '</option>';
            if (m === leapMonth) {
                html += '<option value="' + m + '" data-leap="1">闰' + monthNames[m-1] + '</option>';
            }
        }
        monthSel.innerHTML = html;

        // 恢复之前选择的月份
        var found = false;
        for (var i = 0; i < monthSel.options.length; i++) {
            if (parseInt(monthSel.options[i].value) === currentMonth) {
                monthSel.options[i].selected = true;
                found = true;
                break;
            }
        }
        if (!found && monthSel.options.length > 0) {
            monthSel.options[0].selected = true;
        }
    }

    /**
     * 填充农历日期天数
     */
    function fillLunarDays(prefix) {
        var yearSel = $(prefix + 'Year');
        var monthSel = $(prefix + 'Month');
        var daySel = $(prefix + 'Day');
        var year = parseInt(yearSel.value);
        var month = parseInt(monthSel.value);

        // 检查是否选中了闰月选项
        var selectedMonthOption = monthSel.selectedOptions && monthSel.selectedOptions[0];
        var isLeapMonth = selectedMonthOption && selectedMonthOption.getAttribute('data-leap') === '1';

        var daysInMonth;
        if (isLeapMonth) {
            daysInMonth = Lunar.leapDays(year);
        } else {
            daysInMonth = Lunar.lunarMonthDays(year, month);
        }

        var currentDay = parseInt(daySel.value) || 1;
        if (currentDay > daysInMonth) currentDay = daysInMonth;

        var lunarDayNames = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
            '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
            '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

        daySel.innerHTML = '';
        for (var d = 1; d <= daysInMonth; d++) {
            var opt = document.createElement('option');
            opt.value = d;
            opt.textContent = lunarDayNames[d - 1] || (d + '日');
            if (d === currentDay) opt.selected = true;
            daySel.appendChild(opt);
        }
    }

    // ==================== 真太阳时校准 + 八字排盘 ====================
    function getBaziResult(prefix, calendarType, gender) {
        var year = parseInt($(prefix + 'Year').value);
        var month = parseInt($(prefix + 'Month').value);
        var day = parseInt($(prefix + 'Day').value);
        var hour = parseInt($(prefix + 'Hour').value);
        var minute = parseInt($(prefix + 'Minute').value);

        var province = $(prefix + 'Province').value;
        var city = $(prefix + 'City').value;
        var coord = CityData.getCoord(province, city);
        var longitude = coord ? coord.longitude : 116.4;

        // 吉时吉分处理
        if (hour === -1) hour = 0;
        if (minute === -1) minute = 0;

        // 农历转公历
        if (calendarType === 'lunar') {
            var selectedMonthOption = $(prefix + 'Month').selectedOptions[0];
            var isLeap = selectedMonthOption && selectedMonthOption.getAttribute('data-leap') === '1';
            var solar = Lunar.lunarToSolar(year, month, day, isLeap);
            if (!solar) return null;
            year = solar.year;
            month = solar.month;
            day = solar.day;
        }

        return Bazi.generate(year, month, day, hour, minute, gender, longitude);
    }

    // ==================== 解析大模型返回内容 ====================
    function parseAiContent(text) {
        var html = '';
        var lines = text.split('\n');
        var inScheme = false;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) {
                if (inScheme) { html += '</div>'; inScheme = false; }
                continue;
            }

            // 检测章节标题 【xxx】
            if (line.indexOf('【') === 0 && line.indexOf('】') > 0) {
                if (inScheme) { html += '</div>'; inScheme = false; }
                html += '<div class="section-header">' + escapeHtml(line) + '</div>';
                continue;
            }

            // 检测得分行
            if (line.indexOf('得分：') === 0 || line.indexOf('得分:') === 0) {
                html += '<div class="score-line">' + escapeHtml(line) + '</div>';
                continue;
            }

            // 检测综合评分行
            if (line.indexOf('综合评分') >= 0 || line.indexOf('命局匹配度') >= 0) {
                html += '<div class="score-line">' + escapeHtml(line) + '</div>';
                continue;
            }

            // 检测推荐姓名行
            var nameMatch = line.match(/^推荐姓名[：:]\s*(.+)$/);
            if (nameMatch) {
                if (inScheme) { html += '</div>'; }
                html += '<div class="name-scheme">';
                html += '<div class="name-scheme-name">' + escapeHtml(nameMatch[1]) + '</div>';
                inScheme = true;
                continue;
            }

            // 检测五行属性行
            var wxMatch = line.match(/^五行属性[：:]\s*(.+)$/);
            if (wxMatch && inScheme) {
                html += '<div class="name-scheme-wx">五行：' + escapeHtml(wxMatch[1]) + '</div>';
                continue;
            }

            // 普通文本行
            if (inScheme) {
                html += '<div class="name-scheme-meaning">' + escapeHtml(line) + '</div>';
            } else {
                html += '<div class="result-desc">' + escapeHtml(line) + '</div>';
            }
        }

        if (inScheme) { html += '</div>'; }
        return html;
    }

    function renderWuxingShiShenAnalysis(name, baziResult) {

        var wx = baziResult.wuXing || {};
        var dayGanIdx = p.day.ganIndex;
        var dayGan = p.day.gan;

            if (strokes % 5 === 1) nameWx.push('木');
            else if (strokes % 5 === 2) nameWx.push('火');
            else if (strokes % 5 === 3) nameWx.push('土');
            else if (strokes % 5 === 4) nameWx.push('金');
            else nameWx.push('水');
        }

        // 十神分析
        var shiShenList = [];
        var pillarKeys = ['year', 'month', 'day', 'hour'];

            var ss = Lunar.getShiShen(dayGanIdx, ganIdx);

        });

        ['木','火','土','金','水'].forEach(function(n) { totalWx += (wx[n] || 0); });

            var wxMap2 = {'木':'水','火':'木','土':'火','金':'土','水':'金'};
            xiYong = '喜用神建议：' + (wxMap2[dayWx] || '木') + '（生扶日主）';

    // ==================== 姓名与八字匹配度分析（纯前端） ====================
    function renderNameMatchingAnalysis(name, baziResult) {
        if (!name || name.length < 1) return '';

        var p = baziResult.pillars;
        var wx = baziResult.wuXing || {};
        var dayGanIdx = p.day.ganIndex;
        var dayGan = p.day.gan;
        var dayWx = Lunar.wuXingGan[dayGanIdx];

        // 一、解析姓名五行（使用字库查询）
        var nameWuxing = [];
        var nameChars = name.split('');
        for (var i = 0; i < nameChars.length; i++) {
            var ch = nameChars[i];
            var foundWx = null;
            // 在五行字库中查找
            for (var wxType in WUXING_CHARS) {
                if (WUXING_CHARS[wxType].indexOf(ch) !== -1) {
                    foundWx = wxType;
                    break;
                }
            }
            // 未找到则使用笔画数映射
            if (!foundWx) {
                var code = ch.charCodeAt(0);
                var wxIdx = code % 5;
                foundWx = ['木', '火', '土', '金', '水'][wxIdx];
            }
            nameWuxing.push({ char: ch, wx: foundWx });
        }

        // 二、提取八字喜用神（使用MingliAnalyzer）
        var xiYongShen = [];
        var jiShen = '';
        var strengthType = '';
        try {
            if (typeof MingliAnalyzer !== 'undefined') {
                var mlResult = MingliAnalyzer.analyze(baziResult);
                if (mlResult && mlResult.strength) {
                    strengthType = mlResult.strength.type;
                    var xiShenStr = mlResult.strength.xiShen || '';
                    // 解析喜用神（可能是"金水"这样的组合）
                    if (xiShenStr) {
                        for (var k = 0; k < xiShenStr.length; k++) {
                            if ('金木水火土'.indexOf(xiShenStr[k]) !== -1) {
                                xiYongShen.push(xiShenStr[k]);
                            }
                        }
                    }
                    // 忌神为克日主的五行
                    var keMap = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };
                    jiShen = keMap[dayWx] || '';
                }
            }
        } catch(e) {}

        // 如果MingliAnalyzer未返回，使用简单判断
        if (xiYongShen.length === 0) {
            var totalWx = 0;
            ['木','火','土','金','水'].forEach(function(n) { totalWx += (wx[n] || 0); });
            var dayWxCount = wx[dayWx] || 0;
            strengthType = dayWxCount >= Math.ceil(totalWx / 5) + 1 ? '身强' : (dayWxCount <= Math.floor(totalWx / 5) - 1 ? '身弱' : '中和');
            if (strengthType === '身强') {
                var wxMap = {'木':'金','火':'水','土':'木','金':'火','水':'土'};
                xiYongShen = [wxMap[dayWx] || '金'];
            } else if (strengthType === '身弱') {
                var wxMap2 = {'木':'水','火':'木','土':'火','金':'土','水':'金'};
                xiYongShen = [wxMap2[dayWx] || '水'];
            } else {
                xiYongShen = [dayWx];
            }
            var keMap2 = { '木': '金', '火': '水', '土': '木', '金': '火', '水': '土' };
            jiShen = keMap2[dayWx] || '';
        }

        // 三、五行匹配度分析
        var matchCount = 0;
        var jiCount = 0;
        for (var m = 0; m < nameWuxing.length; m++) {
            if (xiYongShen.indexOf(nameWuxing[m].wx) !== -1) matchCount++;
            if (nameWuxing[m].wx === jiShen) jiCount++;
        }

        var matchLevel = '需关注';
        var matchDesc = '';
        if (matchCount >= nameWuxing.length) {
            matchLevel = '精准契合';
            matchDesc = '名字五行精准补益八字，搭配得当';
        } else if (matchCount >= Math.ceil(nameWuxing.length / 2)) {
            matchLevel = '较契合';
            matchDesc = '名字五行与八字喜用神契合，可补益命局所需';
        } else if (jiCount > 0) {
            matchLevel = '需关注';
            matchDesc = '名字中存在与命局相忌的五行，建议关注';
        } else {
            matchLevel = '一般';
            matchDesc = '名字五行与八字喜用神关系一般';
        }

        // 四、姓与名五行生克分析
        var shengKeResult = '';
        var shengKeLevel = '';
        if (nameWuxing.length >= 2) {
            var xingWx = nameWuxing[0].wx;
            var ming1Wx = nameWuxing[1].wx;
            var ming2Wx = nameWuxing.length > 2 ? nameWuxing[2].wx : null;

            // 检查顺生：姓生名1，名1生名2
            var isShunSheng = false;
            var hasKe = false;

            if (WX_SHENG_MAP[xingWx] === ming1Wx) {
                if (!ming2Wx || WX_SHENG_MAP[ming1Wx] === ming2Wx) {
                    isShunSheng = true;
                }
            }

            // 检查相克
            if (WX_KE_MAP[xingWx] === ming1Wx || WX_KE_MAP[ming1Wx] === xingWx) hasKe = true;
            if (ming2Wx && (WX_KE_MAP[ming1Wx] === ming2Wx || WX_KE_MAP[ming2Wx] === ming1Wx)) hasKe = true;
            if (ming2Wx && (WX_KE_MAP[xingWx] === ming2Wx || WX_KE_MAP[ming2Wx] === xingWx)) hasKe = true;

            if (isShunSheng && !hasKe) {
                shengKeResult = '姓与名五行顺生流转，气韵通畅';
                shengKeLevel = '顺畅';
            } else if (hasKe) {
                shengKeResult = '姓与名之间存在五行相克，流转有阻';
                shengKeLevel = '有阻';
            } else {
                shengKeResult = '姓与名五行关系平和';
                shengKeLevel = '平和';
            }
        } else {
            shengKeResult = '单字名，无内部生克关系';
            shengKeLevel = '平和';
        }

        // 五、综合评分（固定公式）
        // 五行匹配度 60分
        var wuxingScore = Math.round((matchCount / nameWuxing.length) * 60);
        // 生克结构 20分
        var shengkeScore = shengKeLevel === '顺畅' ? 20 : (shengKeLevel === '平和' ? 15 : 10);
        // 字义寓意 15分
        var meaningScore = 0;
        for (var c = 0; c < nameChars.length; c++) {
            if (AUSPICIOUS_CHARS.indexOf(nameChars[c]) !== -1) meaningScore += Math.round(15 / nameChars.length);
        }
        meaningScore = Math.min(15, meaningScore);
        // 音律字形 5分（基于名字长度合理性）
        var yinluScore = nameChars.length >= 2 && nameChars.length <= 4 ? 5 : 3;
        // 总分
        var totalScore = wuxingScore + shengkeScore + meaningScore + yinluScore;

        // 六、专业评述
        var comment = '';
        if (matchLevel === '精准契合' || matchLevel === '较契合') {
            comment = '《三命通会》："五行之气，顺生者吉，相济者美。"';
        } else if (shengKeLevel === '顺畅') {
            comment = '《渊海子平》："五行相生，则生生不息，运自亨通。"';
        } else if (matchCount > 0) {
            comment = '《穷通宝鉴》："调和气候，五行得宜。"';
        } else {
            comment = '从传统命理角度，可考虑适当补益' + xiYongShen.join('、') + '以助命局平衡。';
        }

        // 七、生成HTML
        var html = '<div class="ai-result-card">';
        html += '<div class="result-title">姓名五行分析</div>';

        // 姓名五行解析
        html += '<div class="result-subtitle">姓名五行属性</div>';
        html += '<div class="result-desc">';
        var wxDisplay = nameWuxing.map(function(item) {
            return '<span style="display:inline-block;padding:4px 10px;margin:4px;border-radius:6px;background:var(--bg-secondary);border:1px solid var(--border-color);"><strong>' + escapeHtml(item.char) + '</strong>（' + item.wx + '）</span>';
        }).join('');
        html += wxDisplay;
        html += '<br>名字五行组合：' + nameWuxing.map(function(item) { return item.wx; }).join(' ');
        html += '</div>';

        // 八字喜用神
        html += '<div class="result-subtitle">八字喜用神</div>';
        html += '<div class="result-desc">';
        html += '日主：' + dayGan + '（' + dayWx + '），' + strengthType + '<br>';
        html += '喜用五行：' + xiYongShen.join('、') + '<br>';
        html += '忌用五行：' + (jiShen || '无');
        html += '</div>';

        // 五行匹配度
        html += '<div class="result-subtitle">五行匹配度</div>';
        html += '<div class="result-desc">';
        html += '名字五行与八字喜用神匹配度：<strong>' + matchLevel + '</strong><br>';
        html += matchDesc + '<br>';
        html += '姓与名五行流转：<strong>' + shengKeLevel + '</strong>（' + shengKeResult + '）';
        html += '</div>';

        // 综合评分
        html += '<div class="result-subtitle">综合评分</div>';
        html += '<div class="result-desc">';
        html += '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;">';
        html += '<span style="flex:1;min-width:120px;padding:8px 12px;background:var(--bg-secondary);border-radius:6px;text-align:center;">五行匹配度<br><strong>' + wuxingScore + '</strong>/60</span>';
        html += '<span style="flex:1;min-width:120px;padding:8px 12px;background:var(--bg-secondary);border-radius:6px;text-align:center;">生克结构<br><strong>' + shengkeScore + '</strong>/20</span>';
        html += '<span style="flex:1;min-width:120px;padding:8px 12px;background:var(--bg-secondary);border-radius:6px;text-align:center;">字义寓意<br><strong>' + meaningScore + '</strong>/15</span>';
        html += '<span style="flex:1;min-width:120px;padding:8px 12px;background:var(--bg-secondary);border-radius:6px;text-align:center;">音律字形<br><strong>' + yinluScore + '</strong>/5</span>';
        html += '</div>';
        html += '<div style="text-align:center;padding:12px;background:linear-gradient(135deg,var(--red-light),#fff);border-radius:8px;border:1px solid var(--red-primary);">';
        html += '<span style="font-size:14px;color:var(--text-secondary);">总分</span><br>';
        html += '<span style="font-size:28px;font-weight:700;color:var(--red-primary);">' + totalScore + '</span><span style="font-size:16px;color:var(--text-light);">/100</span>';
        html += '</div>';
        html += '</div>';

        // 专业评述
        html += '<div class="result-subtitle">专业评述</div>';
        html += '<div class="result-desc" style="font-style:italic;color:var(--text-secondary);">';
        html += comment;
        html += '<div style="margin-top:8px;font-size:12px;color:var(--text-light);">以上分析基于传统命理典籍，仅供文化参考，不构成人生决策依据。</div>';
        html += '</div>';

        html += '</div>';
        return html;

    /**

    function getSurnameWuxing(surname) {
        if (!surname) return '土';
        var ch = surname.charAt(surname.length - 1);
        var code = ch.charCodeAt(0);
        var wxIdx = code % 5;
        return ['木', '火', '土', '金', '水'][wxIdx];
    }

    /**

    function pickChar(wxType, usedChars) {
        var chars = WUXING_CHARS[wxType];
        if (!chars || chars.length === 0) return '宇';
        // 尝试避免重复
        var available = chars.filter(function(c) { return usedChars.indexOf(c) === -1; });
        if (available.length === 0) available = chars;
        return available[Math.floor(Math.random() * available.length)];

        var wx = baziResult.wuXing || {};
        var dayGanIdx = p.day.ganIndex;
        var dayWx = Lunar.wuXingGan[dayGanIdx];

        // 使用 MingliAnalyzer 获取更精准的喜用神
        var xiYongShen = '';
        var strengthType = '';
        var geJuName = '';
        try {
            if (typeof MingliAnalyzer !== 'undefined') {
                var mlResult = MingliAnalyzer.analyze(baziResult);
                if (mlResult) {
                    strengthType = mlResult.strength ? mlResult.strength.type : '';
                    xiYongShen = mlResult.strength ? (mlResult.strength.xiShen || '') : '';
                    geJuName = mlResult.geJu ? mlResult.geJu.name : '';
                }
            }
        } catch(e) {}

        // 如果 MingliAnalyzer 未返回喜用神，使用简单判断
        if (!xiYongShen) {
            var totalWx = 0;
            ['木','火','土','金','水'].forEach(function(n) { totalWx += (wx[n] || 0); });
            var dayWxCount = wx[dayWx] || 0;
            if (dayWxCount >= Math.ceil(totalWx / 5) + 1) {
                // 身强，喜食伤泄秀
                xiYongShen = WX_SHENG_MAP[dayWx] || '水';
                strengthType = '身强';
            } else if (dayWxCount <= Math.floor(totalWx / 5) - 1) {
                // 身弱，喜印比助身
                var shengMe = '';
                for (var k in WX_SHENG_MAP) {
                    if (WX_SHENG_MAP[k] === dayWx) { shengMe = k; break; }
                }
                xiYongShen = shengMe || dayWx;
                strengthType = '身弱';
            } else {
                xiYongShen = dayWx;
                strengthType = '中和';
            }
        }

        // 找出最缺的五行
        var wxList = ['木','火','土','金','水'];
        var missingWx = wxList.filter(function(n) { return (wx[n] || 0) === 0; });
        var weakestWx = '';
        if (missingWx.length > 0) {
            weakestWx = missingWx[0];
        } else {
            // 找数量最少的
            var minCount = 999;
            wxList.forEach(function(n) {
                if ((wx[n] || 0) < minCount) {
                    minCount = wx[n] || 0;
                    weakestWx = n;
                }
            });
        }

        var surnameWx = getSurnameWuxing(surname);
        var suggestions = [];
        var usedChars = [];

        // 名字1：五行顺生方向（姓五行 → 名1五行 → 名2五行）
        var wx1_shun = WX_SHENG_MAP[surnameWx] || '火';
        var wx2_shun = WX_SHENG_MAP[wx1_shun] || '土';
        var char1_shun = pickChar(wx1_shun, usedChars);
        usedChars.push(char1_shun);
        var char2_shun = pickChar(wx2_shun, usedChars);
        usedChars.push(char2_shun);
        suggestions.push({
            name: surname + char1_shun + char2_shun,
            wxChain: surnameWx + '→' + wx1_shun + '→' + wx2_shun,
            wxLabel: surnameWx + wx1_shun + wx2_shun,
            strategy: '五行顺生',
            reference: '《三命通会》："五行之气，顺生者吉，逆克者凶。"',
            explanation: '此名五行顺生流转（' + surnameWx + '生' + wx1_shun + '，' + wx1_shun + '生' + wx2_shun + '），气韵流畅，寓意生生不息、福泽绵延。'
        });

        // 名字2：五行逆生方向（用于特殊格局需求）
        // 逆生：名2五行 → 名1五行 → 姓五行（即名1生姓，名2生名1）
        var wx1_ni = '';
        var wx2_ni = '';
        for (var k2 in WX_SHENG_MAP) {
            if (WX_SHENG_MAP[k2] === surnameWx) { wx1_ni = k2; break; }
        }
        if (!wx1_ni) wx1_ni = '水';
        for (var k3 in WX_SHENG_MAP) {
            if (WX_SHENG_MAP[k3] === wx1_ni) { wx2_ni = k3; break; }
        }
        if (!wx2_ni) wx2_ni = '木';
        var char1_ni = pickChar(wx1_ni, usedChars);
        usedChars.push(char1_ni);
        var char2_ni = pickChar(wx2_ni, usedChars);
        usedChars.push(char2_ni);
        suggestions.push({
            name: surname + char1_ni + char2_ni,
            wxChain: wx2_ni + '→' + wx1_ni + '→' + surnameWx,
            wxLabel: surnameWx + wx1_ni + wx2_ni,
            strategy: '逆生回补',
            reference: '《渊海子平》："有逆生之格，以印星生身，反哺有功。"',
            explanation: '此名取逆生回补之法（' + wx2_ni + '生' + wx1_ni + '，' + wx1_ni + '生' + surnameWx + '），反哺日主，适用于需印星护身之命局。'
        });

        // 名字3：专补喜用神方向
        var buWx = xiYongShen || weakestWx || '水';
        var buWx2 = WX_SHENG_MAP[buWx] || '木'; // 第二字取喜用神所生之五行，增强流通
        var char1_bu = pickChar(buWx, usedChars);
        usedChars.push(char1_bu);
        var char2_bu = pickChar(buWx2, usedChars);
        usedChars.push(char2_bu);
        suggestions.push({
            name: surname + char1_bu + char2_bu,
            wxChain: surnameWx + '→' + buWx + '→' + buWx2,
            wxLabel: surnameWx + buWx + buWx2,
            strategy: '专补喜用',
            reference: '《穷通宝鉴》："调和气候，五行得宜，方为上格。"',
            explanation: '此名专补喜用神' + buWx + '，' +
                (strengthType === '身强' ? '可泄日主过旺之势，使五行归于中和平衡。' :
                 strengthType === '身弱' ? '可助日主身弱之局，增强命主根基与气运。' :
                 '可进一步调和五行，使命局更加圆满周全。')
        });

        return {
            suggestions: suggestions,
            xiYongShen: xiYongShen,
            strengthType: strengthType,
            weakestWx: weakestWx,
            dayWx: dayWx,
            geJuName: geJuName
        };
    }

    // ==================== 取名主流程（纯前端分析） ====================
    async function doName() {
        var surname = $('nameSurname').value.trim();
        if (!surname) { showToast('请输入姓氏'); $('nameSurname').focus(); return; }

        var province = $('nameProvince').value;
        var city = $('nameCity').value;
        if (!province || !city) { showToast('请选择出生地'); return; }

        var baziResult = getBaziResult('name', nameCalendarType, nameGender);
        if (!baziResult) {
            showToast('八字排盘失败，请检查输入的日期');
            return;
        }

        var resultArea = $('resultArea');
        resultArea.style.display = 'block';

        var baziHtml = renderBaziResult(baziResult);
        var analysisHtml = renderWuxingShiShenAnalysis(surname, baziResult);

        // 天干地支关系分析
        var relationHtml = renderRelationAnalysis(baziResult);

        // 命理专业评测（格局/强弱喜忌/调候/神煞/综合评述）
        var mingliHtml = '';
        if (typeof MingliAnalyzer !== 'undefined') {
            try {
                var mlResult = MingliAnalyzer.analyze(baziResult);
                mingliHtml = mlResult ? mlResult.html : '';
            } catch(e) { console.warn('命理评测异常:', e); }
        }

        // 五行取名推荐（纯前端）
        var nameSuggestions = generateNameSuggestions(surname, baziResult);
        var nameSuggestHtml = renderNameSuggestions(surname, nameSuggestions);

        resultArea.innerHTML = baziHtml + analysisHtml + relationHtml + mingliHtml + nameSuggestHtml;
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ==================== 事件绑定 ====================
    function bindEvents() {
        // Tab1 公历/农历切换
        var evalCalItems = document.querySelectorAll('#evalCalendarSwitch .switch-item');
        evalCalItems.forEach(function(item) {
            item.addEventListener('click', function() {
                evalCalItems.forEach(function(i) { i.classList.remove('active'); });
                this.classList.add('active');
                switchCalendar('eval', this.getAttribute('data-type'));
            });
        });

        // Tab2 公历/农历切换
        var nameCalItems = document.querySelectorAll('#nameCalendarSwitch .switch-item');
        nameCalItems.forEach(function(item) {
            item.addEventListener('click', function() {
                nameCalItems.forEach(function(i) { i.classList.remove('active'); });
                this.classList.add('active');
                switchCalendar('name', this.getAttribute('data-type'));
            });
        });

        // Tab1 年月联动
        $('evalYear').addEventListener('change', function() {
            if (evalCalendarType === 'lunar') {
                updateLunarMonthOptions('eval');
                fillLunarDays('eval');
            } else {
                fillSolarDays('eval', parseInt(this.value), parseInt($('evalMonth').value));
            }
        });
        $('evalMonth').addEventListener('change', function() {
            if (evalCalendarType === 'lunar') {
                fillLunarDays('eval');
            } else {
                fillSolarDays('eval', parseInt($('evalYear').value), parseInt(this.value));
            }
        });

        // Tab2 年月联动
        $('nameYear').addEventListener('change', function() {
            if (nameCalendarType === 'lunar') {
                updateLunarMonthOptions('name');
                fillLunarDays('name');
            } else {
                fillSolarDays('name', parseInt(this.value), parseInt($('nameMonth').value));
            }
        });
        $('nameMonth').addEventListener('change', function() {
            if (nameCalendarType === 'lunar') {
                fillLunarDays('name');
            } else {
                fillSolarDays('name', parseInt($('nameYear').value), parseInt(this.value));
            }
        });

        // 省市联动
        $('evalProvince').addEventListener('change', function() { onProvinceChange('eval'); });
        $('nameProvince').addEventListener('change', function() { onProvinceChange('name'); });

        // 按钮 - 直接调用（纯前端分析，无需会员检查）
        $('btnEvaluate').addEventListener('click', function() { doEvaluate(); });
        $('btnName').addEventListener('click', function() { doName(); });
    }

    // ==================== 排盘记录预加载缓存 ====================
    var _cachedRecords = null;
    (async function preloadRecords() {
        try { _cachedRecords = await Storage.getRecords(true); } catch(e) { _cachedRecords = []; }
    })();

    // ==================== 评测界面排盘记录下拉 ====================
    function initEvalRecordDropdown() {
        loadEvalRecordOptions();
        var sel = $('evalRecordSelect');
        if (sel) {
            sel.addEventListener('focus', function() {
                loadEvalRecordOptions();
            });
            sel.addEventListener('change', function() {
                fillEvalFromRecord();
            });
        }
    }

    async function loadEvalRecordOptions() {
        var sel = $('evalRecordSelect');
        if (!sel) return;
        var currentValue = sel.value;
        sel.innerHTML = '<option value="">-- 请选择排盘记录 --</option>';
        try {
            var records = _cachedRecords || await Storage.getRecords(true);
            if (!_cachedRecords) _cachedRecords = records;
            if (records && records.length > 0) {
                var fragment = document.createDocumentFragment();
                var existingTexts = {};
                Array.from(sel.options).forEach(function(opt) { existingTexts[opt.textContent] = true; });
                records.forEach(function(r) {
                    var genderLabel = r.gender === 1 || r.gender === '男' ? '男' : (r.gender === 0 || r.gender === '女' ? '女' : '未知');
                    var text = (r.name || '未命名') + ' (' + genderLabel + ')';
                    if (!existingTexts[text]) {
                        existingTexts[text] = true;
                        var opt = document.createElement('option');
                        opt.value = r.id || '';
                        opt.textContent = text;
                        opt.dataset.record = JSON.stringify(r);
                        fragment.appendChild(opt);
                    }
                });
                sel.appendChild(fragment);
                if (currentValue) sel.value = currentValue;
            }
        } catch(e) {
            console.log('读取排盘记录失败:', e);
        }
    }

    function fillEvalFromRecord() {
        var sel = $('evalRecordSelect');
        if (!sel || !sel.value) return;
        var opt = sel.selectedOptions[0];
        if (!opt || !opt.dataset.record) return;
        try {
            var record = JSON.parse(opt.dataset.record);
            // 填充姓名
            if (record.name) $('evalName').value = record.name;
            // 填充性别
            if (record.gender !== undefined) {
                var genderNum = record.gender === 1 || record.gender === '男' ? 1 : (record.gender === 0 || record.gender === '女' ? 0 : -1);
                if (genderNum >= 0) {
                    evalGender = genderNum;
                    var items = document.querySelectorAll('#evalGenderSwitch .gender-item');
                    items.forEach(function(el) {
                        el.classList.remove('active');
                        if (parseInt(el.getAttribute('data-gender')) === genderNum) {
                            el.classList.add('active');
                        }
                    });
                }
            }
            // 填充出生日期
            if (record.solarDate) {
                var parts = record.solarDate.split('-');
                if (parts.length === 3) {
                    $('evalYear').value = parseInt(parts[0]);
                    $('evalMonth').value = parseInt(parts[1]);
                    $('evalDay').value = parseInt(parts[2]);
                    // 触发天数更新
                    fillSolarDays('eval', parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                }
            }
            // 填充出生时间
            if (record.formData && record.formData.hour !== undefined) {
                $('evalHour').value = record.formData.hour;
            } else if (record.birthHour !== undefined && record.birthHour !== null) {
                $('evalHour').value = record.birthHour;
            }
            if (record.formData && record.formData.minute !== undefined) {
                $('evalMinute').value = record.formData.minute;
            }
            // 填充省份城市
            if (record.formData && record.formData.province) {
                $('evalProvince').value = record.formData.province;
                onProvinceChange('eval');
                // 延迟设置城市（等待联动加载完成）
                if (record.formData.city) {
                    setTimeout(function() {
                        $('evalCity').value = record.formData.city;
                    }, 100);
                }
            }
        } catch(e) {
            console.log('填充记录失败:', e);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

// ==================== 姓名记录存储（跨页面共享） ====================
var NameRecordStore = {
    KEY: 'bazi_name_records',
    save: function(type, data) {
        try {
            var user = Storage.getCurrentUser();
            var records = JSON.parse(localStorage.getItem(this.KEY) || '[]');
            records.unshift({
                id: Date.now(),
                type: type, // 'evaluate' 或 'name'
                username: user ? user.username : 'guest',
                name: data.name || data.surname || '',
                gender: data.gender || '',
                style: data.style || '',
                result: data.result || '',
                time: data.time || Date.now()
            });
            // 最多保留100条记录
            if (records.length > 100) records = records.slice(0, 100);
            localStorage.setItem(this.KEY, JSON.stringify(records));
        } catch (e) {
            console.error('保存姓名记录失败:', e);
        }
    },
    getAll: function() {
        try {
            return JSON.parse(localStorage.getItem(this.KEY) || '[]');
        } catch (e) {
            return [];
        }
    },
    getByUser: function(username) {
        if (!username) username = 'guest';
        return this.getAll().filter(function(r) { return r.username === username; });
    },
    delete: function(id) {
        try {
            var records = this.getAll().filter(function(r) { return r.id !== id; });
            localStorage.setItem(this.KEY, JSON.stringify(records));
        } catch (e) {
            console.error('删除姓名记录失败:', e);
        }
    },
    clear: function() {
        try {
            localStorage.removeItem(this.KEY);
        } catch (e) {}
    }
};
